name: Daily Scrape

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WX_RSS_URLS: ${{ secrets.WX_RSS_URLS }}
          FUNDS: ${{ secrets.FUNDS }}
          DAILYHOT_API: ${{ secrets.DAILYHOT_API }}
        run: python hot_scraper.py --commit

      - name: Done
        if: success()
        run: echo "Data updated successfully"